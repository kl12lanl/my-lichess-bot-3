name: LichessBot

on:
  push:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run
      run: |
        echo "=== СТАРТ БОТА ==="
        python lichess-bot.py
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}

