name: Lichess Bot

on:
  # Запуск при любом обновлении кода
  push:
    branches: [ main, master ]
  # Автоматический перезапуск каждые 30 минут, чтобы бот не спал
  schedule:
    - cron: '*/30 * * * *'
  # Позволяет запускать бота вручную кнопкой Run workflow
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      run: python lichess-bot.py
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}

     
